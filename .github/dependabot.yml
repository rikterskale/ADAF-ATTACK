version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
    ignore:
      - dependency-name: certipy-ad
      - dependency-name: cryptography
    groups:
      python-runtime:
        applies-to: version-updates
        patterns:
          - "typer"
          - "rich"
          - "pydantic*"
          - "httpx"
          - "ldap3"
          - "PyYAML"
