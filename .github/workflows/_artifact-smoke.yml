name: Artifact smoke (reusable)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  artifact_smoke:
    name: Artifact smoke (${{ matrix.os }} / Python ${{ matrix.python-version }} / ${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python-version: "3.11"
            artifact: wheel
            extras: base
          - os: ubuntu-24.04
            python-version: "3.13"
            artifact: sdist
            extras: base
          - os: windows-2022
            python-version: "3.12"
            artifact: wheel
            extras: base
          - os: macos-14
            python-version: "3.13"
            artifact: wheel
            extras: base
          - os: ubuntu-24.04
            python-version: "3.14"
            artifact: wheel
            extras: base
          - os: ubuntu-24.04
            python-version: "3.12"
            artifact: wheel
            extras: full
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download built distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist

      - name: Validate release manifest
        run: >-
          python scripts/generate_release_manifest.py
          --repo-root . --dist dist
          --output dist/release-manifest.json --validate

      - name: Validate release provenance
        run: >-
          python scripts/generate_release_provenance.py
          --repo-root . --dist dist
          --output dist/release-provenance.json --validate

      - name: Verify downloaded distribution checksums
        shell: bash
        run: |
          set -euo pipefail
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum -c SHA256SUMS)
          else
            (cd dist && shasum -a 256 -c SHA256SUMS)
          fi

      - name: Install and exercise the clean distribution
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          if [[ "${{ matrix.artifact }}" == "wheel" ]]; then
            artifacts=(dist/*.whl)
          else
            artifacts=(dist/*.tar.gz)
          fi
          if [[ "${#artifacts[@]}" -ne 1 ]]; then
            echo "Expected exactly one ${{ matrix.artifact }} artifact, found ${#artifacts[@]}" >&2
            exit 1
          fi
          python scripts/smoke_distribution.py \
            --artifact "${artifacts[0]}" \
            --venv "$RUNNER_TEMP/adaf-artifact-smoke" \
            --extras "${{ matrix.extras }}"
