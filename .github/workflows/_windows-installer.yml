name: Windows installer lifecycle (reusable)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  windows_installer:
    name: Windows installer (${{ matrix.shell }} / Python ${{ matrix.python-version }})
    needs: [package, scripts]
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shell: powershell
            python-version: "3.11"
            preexisting-config: false
          - shell: pwsh
            python-version: "3.13"
            preexisting-config: true
          - shell: pwsh
            python-version: "3.14"
            preexisting-config: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download built distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist

      - name: Run lifecycle with Windows PowerShell 5.1
        if: matrix.shell == 'powershell'
        shell: powershell
        run: .\scripts\Test-WindowsInstaller.ps1 -RepoRoot $PWD

      - name: Run lifecycle with PowerShell 7
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: .\scripts\Test-WindowsInstaller.ps1 -RepoRoot $PWD -PreexistingConfig


