name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs; keep main runs so green results stick
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"
  PIP_DEFAULT_TIMEOUT: "60"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install lint dependencies (retry)
        shell: bash
        run: |
          set -euo pipefail
          installed=0
          for i in 1 2 3; do
            if python -m pip install --upgrade pip && \
              python -m pip install --no-deps --requirement requirements-ci.txt && \
              python -m pip install --no-build-isolation --no-deps -e ".[dev]" && \
              python -m pip check; then
              installed=1
              break
            fi
            echo "Install attempt $i failed; retrying..."
            sleep $((i * 5))
          done
          test "$installed" -eq 1

      - name: Ruff check
        run: ruff check src tests

      - name: Ruff format check
        run: ruff format --check src tests

      - name: Mypy (advisory — strict baseline cleanup pending)
        continue-on-error: true
        run: mypy src/adaf_attack

  test:
    name: Test (${{ matrix.os }} / py${{ matrix.python-version }})
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Pin images — -latest drifts and is a common source of "Set up job" flakes
        os: [ubuntu-24.04, windows-2022]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install package (dev + kerberos, retry)
        shell: bash
        run: |
          set -euo pipefail
          installed=0
          for i in 1 2 3; do
            if python -m pip install --upgrade pip && \
              python -m pip install --no-deps --requirement requirements-ci.txt && \
              python -m pip install --no-build-isolation --no-deps -e ".[dev,kerberos]" && \
              python -m pip check; then
              installed=1
              break
            fi
            echo "Install attempt $i failed; retrying..."
            sleep $((i * 8))
          done
          test "$installed" -eq 1

      - name: Pytest
        run: python -m pytest -q --tb=short

      - name: CLI smoke — version / doctor / list / paths
        shell: bash
        run: |
          adaf-attack --version
          adaf-attack doctor
          adaf-attack list-capabilities
          adaf-attack paths

  package:
    name: Package build
    needs: [lint, test]
    if: ${{ always() && needs.lint.result == 'success' && needs.test.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Build sdist + wheel
        shell: bash
        run: |
          set -euo pipefail
          built=0
          for i in 1 2 3; do
            if python -m pip install --upgrade pip && \
              python -m pip install --no-deps --requirement requirements-ci.txt && \
              python -m pip check && \
              python -m build --no-isolation; then
              built=1
              break
            fi
            echo "Build attempt $i failed; retrying..."
            sleep $((i * 5))
          done
          test "$built" -eq 1
          test -f dist/*.whl

      - name: Verify wheel in a clean environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .smoke-venv
          .smoke-venv/bin/python -m pip install --upgrade pip
          .smoke-venv/bin/python -m pip install --constraint requirements-ci.txt dist/*.whl
          .smoke-venv/bin/python -m pip check
          .smoke-venv/bin/adaf-attack --version

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          retention-days: 14
