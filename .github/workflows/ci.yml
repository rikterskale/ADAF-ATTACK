name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"
  PIP_DEFAULT_TIMEOUT: "60"

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade "backports.tarfile==1.2.0"
          python -m pip install --upgrade "importlib_metadata==9.0.0"
          python -m pip install --upgrade "colorama==0.4.6"
          python -m pip install --requirement requirements-ci.txt
          python -m pip install --no-deps --no-build-isolation -e ".[dev,ci]"
          python -m pip check

      - name: Ruff lint
        run: python -m ruff check src tests

      - name: Ruff format
        run: python -m ruff format --check src tests

  typecheck:
    name: Strict type checking
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade "backports.tarfile==1.2.0"
          python -m pip install --upgrade "importlib_metadata==9.0.0"
          python -m pip install --upgrade "colorama==0.4.6"
          python -m pip install --requirement requirements-ci.txt
          python -m pip install --no-deps --no-build-isolation -e ".[dev]"
          python -m pip check

      - name: Mypy
        run: python -m mypy src/adaf_attack

  tests:
    name: Tests (${{ matrix.os }} / Python ${{ matrix.python-version }})
    needs: [lint, typecheck]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade "backports.tarfile==1.2.0"
          python -m pip install --upgrade "importlib_metadata==9.0.0"
          python -m pip install --upgrade "colorama==0.4.6"
          python -m pip install --requirement requirements-ci.txt
          python -m pip install --no-deps --no-build-isolation -e ".[dev,kerberos]"
          python -m pip check

      - name: Run tests with 70 percent coverage gate
        run: >-
          python -m pytest
          --cov=adaf_attack
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=70

      - name: CLI smoke tests
        shell: bash
        run: |
          adaf-attack --version
          adaf-attack doctor
          adaf-attack list-capabilities
          adaf-attack paths

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  security:
    name: Dependency and SAST audit
    needs: [lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade "backports.tarfile==1.2.0"
          python -m pip install --upgrade "importlib_metadata==9.0.0"
          python -m pip install --upgrade "colorama==0.4.6"
          python -m pip install --requirement requirements-ci.txt
          python -m pip install --no-deps --no-build-isolation -e ".[ci]"
          python -m pip check

      - name: Audit dependencies
        run: python -m pip_audit --strict --requirement requirements-ci.txt

      - name: Run Bandit SAST
        run: >-
          python -m bandit
          --recursive src
          --severity-level medium
          --confidence-level medium

  scripts:
    name: Validate installer scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Check Bash scripts
        run: shellcheck scripts/*.sh

      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem scripts/*.ps1, scripts/*.psm1 | ForEach-Object {
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$null,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors -and $parseErrors.Count -gt 0) {
              $errors += $_.FullName
            }
          }
          if ($errors.Count -gt 0) {
            Write-Error "PowerShell syntax errors found in: $($errors -join ', ')"
            exit 1
          }

  package:
    name: Build and install package
    needs: [tests, security, scripts]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade "backports.tarfile==1.2.0"
          python -m pip install --upgrade "importlib_metadata==9.0.0"
          python -m pip install --upgrade "colorama==0.4.6"
          python -m pip install --requirement requirements-ci.txt
          python -m pip install --no-deps --no-build-isolation -e ".[ci]"

      - name: Build source distribution and wheel
        run: python -m build --no-isolation

      - name: Validate package metadata
        run: python -m twine check dist/*

      - name: Install wheel in clean environment
        run: |
          python -m venv .smoke-venv
          .smoke-venv/bin/python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade "backports.tarfile==1.2.0"
          python -m pip install --upgrade "importlib_metadata==9.0.0"
          python -m pip install --upgrade "colorama==0.4.6"
          .smoke-venv/bin/python -m pip install dist/*.whl
          .smoke-venv/bin/python -m pip check
          .smoke-venv/bin/adaf-attack --version
          .smoke-venv/bin/adaf-attack list-capabilities

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/
          retention-days: 14
