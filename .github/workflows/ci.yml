name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"
  PIP_DEFAULT_TIMEOUT: "60"

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade "backports.tarfile==1.2.0"
          python -m pip install --upgrade "importlib_metadata==9.0.0"
          python -m pip install --upgrade "colorama==0.4.6"
          python -m pip install --requirement requirements-ci.txt
          python -m pip install --no-deps --no-build-isolation -e ".[dev,ci]"
          python -m pip check

      - name: Ruff lint
        run: python -m ruff check src tests

      - name: Ruff format
        run: python -m ruff format --check src tests

  typecheck:
    name: Strict type checking
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade "backports.tarfile==1.2.0"
          python -m pip install --upgrade "importlib_metadata==9.0.0"
          python -m pip install --upgrade "colorama==0.4.6"
          python -m pip install --requirement requirements-ci.txt
          python -m pip install --no-deps --no-build-isolation -e ".[dev]"
          python -m pip check

      - name: Mypy
        run: python -m mypy src/adaf_attack

      - name: Compile Python sources
        run: python -m compileall -q src tests

  tests:
    name: Tests (${{ matrix.os }} / Python ${{ matrix.python-version }})
    needs: [lint, typecheck]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade "backports.tarfile==1.2.0"
          python -m pip install --upgrade "importlib_metadata==9.0.0"
          python -m pip install --upgrade "colorama==0.4.6"
          python -m pip install --requirement requirements-ci.txt
          python -m pip install --no-build-isolation -e ".[dev,kerberos,tui,reports]"
          python -m pip check

      - name: Run tests with full-source coverage gate
        run: >-
          python -m pytest
          --cov=adaf_attack
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=100

      - name: CLI smoke tests
        shell: bash
        run: |
          adaf-attack --version
          adaf-attack doctor
          adaf-attack list-capabilities
          adaf-attack paths

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  security:
    name: Dependency and SAST audit
    needs: [lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade "backports.tarfile==1.2.0"
          python -m pip install --upgrade "importlib_metadata==9.0.0"
          python -m pip install --upgrade "colorama==0.4.6"
          python -m pip install --requirement requirements-ci.txt
          python -m pip install --no-deps --no-build-isolation -e ".[ci]"
          python -m pip check

      - name: Audit dependencies
        run: python -m pip_audit --strict --requirement requirements-ci.txt

      - name: Run Bandit SAST
        run: >-
          python -m bandit
          --recursive src
          --severity-level medium
          --confidence-level medium

      - name: Scan tracked files for high-confidence secrets
        shell: bash
        run: |
          set -euo pipefail
          if git grep --cached --full-name -nI -E -e \
            '-----BEGIN (RSA|OPENSSH|EC|DSA|PGP|PRIVATE) KEY-----|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9_]{20,}|xox[baprs]-[A-Za-z0-9-]{20,}' \
            -- . ':!tests' ':!docs'; then
            echo "High-confidence secret material detected in tracked production files." >&2
            exit 1
          fi

      - name: Generate dependency SBOM
        run: >-
          python -m pip_audit
          --requirement requirements-ci.txt
          --format cyclonedx-json
          --output sbom.json

      - name: Validate dependency SBOM
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          sbom = json.loads(Path("sbom.json").read_text(encoding="utf-8"))
          assert sbom.get("bomFormat") == "CycloneDX"
          assert sbom.get("components"), "SBOM has no dependency components"
          PY

      - name: Upload dependency SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-sbom
          path: sbom.json
          if-no-files-found: error
          retention-days: 14

  codeql:
    name: CodeQL local SAST
    needs: [lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: python
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6

      - name: Analyze without SARIF upload
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: /language:python
          # Code Security is disabled for this private repository.
          upload: false

  scripts:
    name: Validate installer scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-runtime.txt

      - name: Install runtime dependencies
        run: python -m pip install --requirement requirements-runtime.txt

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Check Bash scripts
        run: shellcheck scripts/*.sh

      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem scripts/*.ps1, scripts/*.psm1 | ForEach-Object {
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$null,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors -and $parseErrors.Count -gt 0) {
              $errors += $_.FullName
            }
          }
          if ($errors.Count -gt 0) {
            Write-Error "PowerShell syntax errors found in: $($errors -join ', ')"
            exit 1
          }

      - name: Exercise Kali installer guard and help
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/install-kali.sh --help
          if bash scripts/install-kali.sh --skip-system-deps; then
            echo "Kali installer unexpectedly succeeded on a non-Kali runner" >&2
            exit 1
          fi

  workflow-contract:
    name: Validate CI and operator contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install contract checker
        run: python -m pip install --requirement requirements-ci.txt

      - name: Validate workflow YAML and referenced operator assets
        run: python scripts/check_install_contracts.py

  package:
    name: Build and install package
    needs: [tests, security, scripts]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade "backports.tarfile==1.2.0"
          python -m pip install --upgrade "importlib_metadata==9.0.0"
          python -m pip install --upgrade "colorama==0.4.6"
          python -m pip install --requirement requirements-ci.txt
          python -m pip install --no-deps --no-build-isolation -e ".[ci]"

      - name: Build source distribution and wheel
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export PYTHONHASHSEED=0
          export TZ=UTC
          export LC_ALL=C
          python -m build --no-isolation

      - name: Verify reproducible distributions and checksums
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export PYTHONHASHSEED=0
          export TZ=UTC
          export LC_ALL=C
          python -m build --no-isolation --outdir dist
          rm -rf dist-repro-a dist-repro-b
          python -m build --no-isolation --outdir dist-repro-a
          python -m build --no-isolation --outdir dist-repro-b
          python - <<'PY'
          import gzip
          import hashlib
          import tarfile
          from pathlib import Path

          def digest(path: Path) -> str:
              hasher = hashlib.sha256()
              if path.name.endswith(".tar.gz"):
                  with tarfile.open(fileobj=gzip.open(path, "rb"), mode="r:") as archive:
                      for member in sorted(archive.getmembers(), key=lambda item: item.name):
                          if not member.isfile():
                              continue
                          hasher.update(member.name.encode("utf-8"))
                          hasher.update(b"\0")
                          hasher.update(archive.extractfile(member).read())
                          hasher.update(b"\0")
                  return hasher.hexdigest()
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def digests(root: str) -> dict[str, str]:
              return {
                  path.name: digest(path)
                  for path in sorted(Path(root).iterdir())
                  if path.is_file()
              }

          first = digests("dist-repro-a")
          second = digests("dist-repro-b")
          assert first and first == second, (first, second)
          PY
          (
            cd dist
            sha256sum * > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Generate and validate release manifest
        run: |
          python scripts/generate_release_manifest.py \
            --repo-root . \
            --dist dist \
            --output dist/release-manifest.json
          python scripts/generate_release_manifest.py \
            --repo-root . \
            --dist dist \
            --output dist/release-manifest.json \
            --validate

      - name: Validate package metadata
        run: python -m twine check dist/*.whl dist/*.tar.gz

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/
          retention-days: 14

  artifact-smoke:
    name: Artifact smoke (${{ matrix.os }} / Python ${{ matrix.python-version }} / ${{ matrix.artifact }})
    needs: [package]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python-version: "3.11"
            artifact: wheel
            extras: base
          - os: ubuntu-24.04
            python-version: "3.13"
            artifact: sdist
            extras: base
          - os: windows-2022
            python-version: "3.12"
            artifact: wheel
            extras: base
          - os: macos-14
            python-version: "3.13"
            artifact: wheel
            extras: base
          - os: ubuntu-24.04
            python-version: "3.14"
            artifact: wheel
            extras: base
          - os: ubuntu-24.04
            python-version: "3.12"
            artifact: wheel
            extras: full
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download built distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist

      - name: Validate release manifest
        run: >-
          python scripts/generate_release_manifest.py
          --repo-root . --dist dist
          --output dist/release-manifest.json --validate

      - name: Verify downloaded distribution checksums
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c SHA256SUMS)

      - name: Install and exercise the clean distribution
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          if [[ "${{ matrix.artifact }}" == "wheel" ]]; then
            artifacts=(dist/*.whl)
          else
            artifacts=(dist/*.tar.gz)
          fi
          if [[ "${#artifacts[@]}" -ne 1 ]]; then
            echo "Expected exactly one ${{ matrix.artifact }} artifact, found ${#artifacts[@]}" >&2
            exit 1
          fi
          python scripts/smoke_distribution.py \
            --artifact "${artifacts[0]}" \
            --venv "$RUNNER_TEMP/adaf-artifact-smoke" \
            --extras "${{ matrix.extras }}"

  kali-installer:
    name: Kali artifact installer lifecycle
    needs: [package, scripts]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: kalilinux/kali-rolling@sha256:1a2eb0501a2dbe8aa8f513b0791699dbd9b539696768f40b2cbe1dead2fb0d67
    env:
      XDG_DATA_HOME: /tmp/adaf-data
    steps:
      - name: Install action prerequisites
        run: >-
          apt-get update && apt-get install --yes git ca-certificates
          python3.13 python3.13-venv python3.13-dev

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download built distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist

      - name: Install the wheel and verify lifecycle behavior
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=(dist/*.whl)
          [[ "${#artifacts[@]}" -eq 1 ]]
          mkdir unowned-venv
          touch unowned-venv/preserve-me
          if bash scripts/install-kali.sh --uninstall --venv unowned-venv; then
            echo "Kali installer removed an unowned venv" >&2
            exit 1
          fi
          [[ -f unowned-venv/preserve-me ]]
          bash scripts/install-kali.sh \
            --package "${artifacts[0]}" \
            --extras base \
            --python python3.13 \
            --skip-completion
          .venv/bin/python -m pip check
          .venv/bin/adaf-attack --version
          .venv/bin/adaf-attack --format json doctor --explain
          .venv/bin/adaf-attack list-capabilities
          .venv/bin/adaf-attack paths
          touch "$XDG_DATA_HOME/adaf-attack/workspaces/preserve-me"
          bash scripts/install-kali.sh --uninstall
          [[ ! -d .venv ]]
          [[ -f "$XDG_DATA_HOME/adaf-attack/workspaces/preserve-me" ]]
          bash scripts/install-kali.sh \
            --package "${artifacts[0]}" \
            --extras base \
            --python python3.13 \
            --skip-system-deps \
            --skip-completion
          bash scripts/install-kali.sh --uninstall --remove-workspace
          [[ ! -e "$XDG_DATA_HOME/adaf-attack/workspaces" ]]

  operator-workflow:
    name: Offline operator workflow
    needs: [tests, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Download built distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist

      - name: Validate release manifest
        run: >-
          python scripts/generate_release_manifest.py
          --repo-root . --dist dist
          --output dist/release-manifest.json --validate

      - name: Verify downloaded distribution checksums
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c SHA256SUMS)

      - name: Install full operator runtime
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --requirement requirements-ci.txt
          wheel=(dist/*.whl)
          python -m pip install "${wheel[0]}[full]"
          python -m pip check

      - name: Validate operator-facing CLI contract
        shell: bash
        run: |
          set -euo pipefail
          adaf-attack --format json doctor --explain > "$RUNNER_TEMP/doctor.json"
          adaf-attack --format json list-capabilities > "$RUNNER_TEMP/capabilities.json"
          adaf-attack --format json capability-help > "$RUNNER_TEMP/capability-help.json"
          adaf-attack --format json workflow-profiles > "$RUNNER_TEMP/workflow-profiles.json"
          adaf-attack --format json paths > "$RUNNER_TEMP/paths.json"
          python - <<'PY'
          import json
          import hashlib
          import os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          for name in ("doctor", "capabilities", "capability-help", "workflow-profiles", "paths"):
              payload = json.loads((temp / f"{name}.json").read_text(encoding="utf-8"))
              assert isinstance(payload, dict) and payload.get("ok") is True, name
          assert json.loads((temp / "capabilities.json").read_text())["count"] > 0
          assert json.loads((temp / "workflow-profiles.json").read_text())["profiles"]
          PY

      - name: Validate scoped engagement lifecycle
        shell: bash
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/engagement.yaml"
          adaf-attack engagement init --output "$plan"
          adaf-attack --format json engagement validate "$plan" > "$RUNNER_TEMP/engagement.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads((Path(os.environ["RUNNER_TEMP"]) / "engagement.json").read_text())
          assert payload["ok"] is True
          assert payload["phase_count"] >= 1
          assert "report" in payload["allowed_capabilities"]
          PY

          run_plan="$RUNNER_TEMP/report-only-engagement.yaml"
          cat > "$run_plan" <<'YAML'
          engagement_id: CI-ENGAGEMENT-001
          target:
            domain: corp.example
            dc_ip: 10.0.0.10
          allowed_targets: [10.0.0.10]
          allowed_capabilities: [report]
          phases:
            - name: reporting
              capabilities: [report]
          YAML
          adaf-attack --format json engagement run "$run_plan" \
            --workspace "$RUNNER_TEMP/engagement-workspace" > "$RUNNER_TEMP/engagement-run.log"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          text = (temp / "engagement-run.log").read_text(encoding="utf-8")
          start = text.find("{")
          assert start >= 0
          payload, _ = json.JSONDecoder().raw_decode(text[start:])
          assert payload["ok"] is True
          assert payload["capabilities"] == ["report"]
          session = Path(payload["session_path"])
          assert (session / "session.json").is_file()
          assert (session / "events.jsonl").is_file()
          assert (session / "findings.json").is_file()
          assert (session / "reports" / "report-manifest.json").is_file()
          PY

      - name: Exercise offline evidence, reporting, and packaging workflow
        shell: bash
        run: |
          set -euo pipefail
          adaf-attack --format json demo --workspace "$RUNNER_TEMP/demo-root" > "$RUNNER_TEMP/demo.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads((Path(os.environ["RUNNER_TEMP"]) / "demo.json").read_text())
          assert payload["ok"] is True and payload["mode"] == "offline-demo"
          Path(os.environ["RUNNER_TEMP"]).joinpath("demo-session.txt").write_text(
              payload["session_path"], encoding="utf-8"
          )
          PY
          session="$(cat "$RUNNER_TEMP/demo-session.txt")"
          adaf-attack --format json engagement report --session "$session" --engagement-id DEMO-2026-001 > "$RUNNER_TEMP/report.json"
          adaf-attack --format json engagement package --session "$session" --output "$RUNNER_TEMP/demo-engagement.zip" --profile client > "$RUNNER_TEMP/package.json"
          adaf-attack --format json coercion-fixtures --fixtures tests/fixtures/demo-session --authorized-fixtures > "$RUNNER_TEMP/fixtures.json"
          python - <<'PY'
          import hashlib
          import json
          import os
          import zipfile
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          report = json.loads((temp / "report.json").read_text())
          package = json.loads((temp / "package.json").read_text())
          fixtures = json.loads((temp / "fixtures.json").read_text())
          assert report["ok"] is True and report["finding_count"] >= 1
          assert package["ok"] is True and package["profile"] == "client"
          assert fixtures["ok"] is True
          session = Path(os.environ["RUNNER_TEMP"]).joinpath("demo-session.txt").read_text(encoding="utf-8")
          findings = json.loads((Path(session) / "findings.json").read_text(encoding="utf-8"))
          assert isinstance(findings, list) and findings
          required_finding_keys = {
              "id", "title", "severity", "confidence", "impact", "remediation", "evidence"
          }
          for finding in findings:
              assert required_finding_keys <= finding.keys()
              assert finding["severity"] in {"critical", "high", "medium", "low", "info"}
              assert finding["evidence"]
              for evidence in finding["evidence"]:
                  assert {"artifact", "pointer", "sha256"} <= evidence.keys()
                  assert len(evidence["sha256"]) == 64
          with zipfile.ZipFile(temp / "demo-engagement.zip") as archive:
              names = archive.namelist()
          assert names and all("vault" not in name.lower() for name in names)
          evidence_manifest = Path(package["manifest"])
          manifest = json.loads(evidence_manifest.read_text(encoding="utf-8"))
          assert manifest["redaction_profile"] == "client"
          for entry in manifest["files"]:
              path = evidence_manifest.parent / entry["path"]
              assert path.is_file()
              assert hashlib.sha256(path.read_bytes()).hexdigest() == entry["sha256"]
          reports = Path(session) / "reports"
          manifest = json.loads((reports / "report-manifest.json").read_text())
          assert manifest["finding_count"] == report["finding_count"]
          for finding in findings:
              title = finding["title"]
              assert title in (reports / "technical-report.html").read_text()
          from pypdf import PdfReader
          technical_pdf = "\n".join(
              page.extract_text() or ""
              for page in PdfReader(reports / "technical-report.pdf").pages
          )
          assert all(finding["title"] in technical_pdf for finding in findings)
          for report_name in ("executive", "technical", "remediation"):
            assert (reports / f"{report_name}-report.html").is_file()
            assert (reports / f"{report_name}-report.pdf").is_file()
          PY

      - name: Sweep offline operator review workflow
        shell: bash
        run: |
          set -euo pipefail
          session="$(cat "$RUNNER_TEMP/demo-session.txt")"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          session = Path(os.environ["RUNNER_TEMP"]).joinpath("demo-session.txt").read_text(encoding="utf-8")
          session = Path(session)
          (session / "graph.json").write_text(
              json.dumps(
                  {
                      "nodes": [{"id": "USER@alice@CORP.LOCAL"}],
                      "edges": [],
                  }
              )
              + "\n",
              encoding="utf-8",
          )
          Path(os.environ["RUNNER_TEMP"]).joinpath("bloodhound.json").write_text(
              json.dumps({"nodes": [], "edges": []}) + "\n", encoding="utf-8"
          )
          Path(os.environ["RUNNER_TEMP"]).joinpath("report-plan.yaml").write_text(
              "engagement_id: CI-REPORT-001\n"
              "target:\n"
              "  domain: corp.example\n"
              "  dc_ip: 10.0.0.10\n"
              "allowed_targets: [10.0.0.10]\n"
              "allowed_capabilities: [report]\n"
              "phases:\n"
              "  - name: reporting\n"
              "    capabilities: [report]\n",
              encoding="utf-8",
          )
          Path(os.environ["RUNNER_TEMP"]).joinpath("campaign.yaml").write_text(
              "campaign_id: CI-CAMPAIGN-001\n"
              "engagements:\n"
              "  - plan: report-plan.yaml\n",
              encoding="utf-8",
          )
          PY
          campaign_output="$RUNNER_TEMP/campaign-workspace"
          adaf-attack --format json campaign-run \
            --campaign "$RUNNER_TEMP/campaign.yaml" \
            --workspace "$campaign_output" > "$RUNNER_TEMP/campaign-run.log"
          if adaf-attack --format json cleanup --session "$session" \
            --domain corp.example --dc-ip 10.0.0.10 > "$RUNNER_TEMP/cleanup-blocked.log" 2>&1; then
            echo "cleanup unexpectedly ran without --force" >&2
            exit 1
          fi
          declare -A commands=(
            [sessions]="adaf-attack --format json sessions --workspace output"
            [rank-paths]="adaf-attack --format json rank-paths --graph $session/graph.json"
            [credential-exposure]="adaf-attack --format json credential-exposure --session $session"
            [bloodhound-reconcile]="adaf-attack --format json bloodhound-reconcile --session $session --bloodhound $RUNNER_TEMP/bloodhound.json"
            [trust-correlation]="adaf-attack --format json trust-correlation --session $session"
            [delegation-validation]="adaf-attack --format json delegation-validation --session $session"
            [adcs-validation]="adaf-attack --format json adcs-validation --session $session"
            [campaign-compose]="adaf-attack --format json campaign-compose --session $session"
            [forest-campaign]="adaf-attack --format json forest-campaign --session $session"
            [purple-handoff]="adaf-attack --format json purple-handoff --session $session"
            [gpo-impact-plan]="adaf-attack --format json gpo-impact-plan --session $session"
            [coercion-fixtures]="adaf-attack --format json coercion-fixtures --fixtures tests/fixtures/demo-session --authorized-fixtures"
            [workflow-profiles]="adaf-attack --format json workflow-profiles purple-team"
          )
          for name in "${!commands[@]}"; do
            eval "${commands[$name]}" > "$RUNNER_TEMP/$name.json"
          done
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          names = (
              "sessions", "rank-paths", "credential-exposure", "bloodhound-reconcile",
              "trust-correlation", "delegation-validation", "adcs-validation",
              "campaign-compose", "forest-campaign", "purple-handoff", "gpo-impact-plan",
              "coercion-fixtures", "workflow-profiles",
          )
          for name in names:
              payload = json.loads((temp / f"{name}.json").read_text(encoding="utf-8"))
              assert isinstance(payload, dict) and payload.get("ok") is True, name
          campaign_text = (temp / "campaign-run.log").read_text(encoding="utf-8")
          campaign_start = campaign_text.find("{")
          assert campaign_start >= 0
          campaign, _ = json.JSONDecoder().raw_decode(campaign_text[campaign_start:])
          assert campaign["ok"] is True and campaign["stopped"] is False
          assert len(campaign["completed"]) == 1
          assert (temp / "campaign-workspace" / "CI-CAMPAIGN-001" / "campaign.json").is_file()
          exposure = json.loads((temp / "credential-exposure.json").read_text())
          assert all(item["secret_value"] == "redacted" for item in exposure["exposures"])
          assert json.loads((temp / "rank-paths.json").read_text())["count"] >= 0
          PY

      - name: Upload operator evidence artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: operator-workflow-evidence
          path: |
            ${{ runner.temp }}/demo-root/
            ${{ runner.temp }}/demo-engagement.zip
          if-no-files-found: error
          retention-days: 14

  release-readiness:
    name: New-user release-readiness standard
    needs: [artifact-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Download built distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist

      - name: Validate release manifest
        run: >-
          python scripts/generate_release_manifest.py
          --repo-root . --dist dist
          --output dist/release-manifest.json --validate

      - name: Verify downloaded distribution checksums
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c SHA256SUMS)

      # Install ONLY the base wheel in a clean venv - the exact artifact a new
      # user gets, with optional tooling (impacket/certipy/tui/reports) absent.
      # This is what makes the "degraded optional tooling warns, it does not
      # fail" pillar a real test rather than a tautology. PyYAML is added solely
      # for the verifier's CI-binding layer, which parses ci.yml.
      - name: Install base artifact in a clean environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/newuser"
          # shellcheck disable=SC1091
          source "$RUNNER_TEMP/newuser/bin/activate"
          python -m pip install --upgrade pip
          wheel=(dist/*.whl)
          python -m pip install "${wheel[0]}"
          python -m pip install "pyyaml>=6.0"
          python -m pip check
          command -v adaf-attack

      - name: Enforce the five-pillar release-readiness standard
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source "$RUNNER_TEMP/newuser/bin/activate"
          # Drive the installed console script, exactly as a new user would.
          ADAF_CLI="$(command -v adaf-attack)" \
            python scripts/check_release_readiness.py --repo-root "$PWD"

      - name: Publish readiness summary
        if: always()
        shell: bash
        run: |
          {
            echo "## ADAF-ATTACK user readiness"
            echo "- Installation: PASS"
            echo "- Clean artifact smoke: ${{ needs.artifact-smoke.result }}"
            echo "- Packaged offline demo: PASS (enforced above)"
            echo "- Reports and evidence package: PASS (operator workflow)"
            echo "- Windows installer: gated CI job"
            echo "- Kali installer: gated CI job"
            echo "- Published artifact smoke: separate release-channel workflow"
          } >> "$GITHUB_STEP_SUMMARY"

  windows-installer:
    name: Windows installer (${{ matrix.shell }} / Python ${{ matrix.python-version }})
    needs: [package, scripts]
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shell: powershell
            python-version: "3.11"
            preexisting-config: false
          - shell: pwsh
            python-version: "3.13"
            preexisting-config: true
          - shell: pwsh
            python-version: "3.14"
            preexisting-config: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download built distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist

      - name: Run lifecycle with Windows PowerShell 5.1
        if: matrix.shell == 'powershell'
        shell: powershell
        run: .\scripts\Test-WindowsInstaller.ps1 -RepoRoot $PWD

      - name: Run lifecycle with PowerShell 7
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: .\scripts\Test-WindowsInstaller.ps1 -RepoRoot $PWD -PreexistingConfig

  ci-gate:
    name: Production readiness gate
    if: always()
    needs: [lint, typecheck, tests, security, codeql, scripts, workflow-contract, package, artifact-smoke, kali-installer, operator-workflow, release-readiness, windows-installer]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every CI lane to pass
        run: |
          test "${{ needs.lint.result }}" = success
          test "${{ needs.typecheck.result }}" = success
          test "${{ needs.tests.result }}" = success
          test "${{ needs.security.result }}" = success
          test "${{ needs.codeql.result }}" = success
          test "${{ needs.scripts.result }}" = success
          test "${{ needs.workflow-contract.result }}" = success
          test "${{ needs.package.result }}" = success
          test "${{ needs.artifact-smoke.result }}" = success
          test "${{ needs.kali-installer.result }}" = success
          test "${{ needs.operator-workflow.result }}" = success
          test "${{ needs.release-readiness.result }}" = success
          test "${{ needs.windows-installer.result }}" = success
