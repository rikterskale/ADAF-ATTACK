name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"
  PIP_DEFAULT_TIMEOUT: "60"

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade "backports.tarfile==1.2.0"
          python -m pip install --upgrade "importlib_metadata==9.0.0"
          python -m pip install --upgrade "colorama==0.4.6"
          python -m pip install --requirement requirements-ci.txt
          python -m pip install --no-deps --no-build-isolation -e ".[dev,ci]"
          python -m pip check

      - name: Ruff lint
        run: python -m ruff check src tests

      - name: Ruff format
        run: python -m ruff format --check src tests

  typecheck:
    name: Strict type checking
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade "backports.tarfile==1.2.0"
          python -m pip install --upgrade "importlib_metadata==9.0.0"
          python -m pip install --upgrade "colorama==0.4.6"
          python -m pip install --requirement requirements-ci.txt
          python -m pip install --no-deps --no-build-isolation -e ".[dev]"
          python -m pip check

      - name: Mypy
        run: python -m mypy src/adaf_attack

  tests:
    name: Tests (${{ matrix.os }} / Python ${{ matrix.python-version }})
    needs: [lint, typecheck]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade "backports.tarfile==1.2.0"
          python -m pip install --upgrade "importlib_metadata==9.0.0"
          python -m pip install --upgrade "colorama==0.4.6"
          python -m pip install --requirement requirements-ci.txt
          python -m pip install --no-build-isolation -e ".[dev,kerberos,tui]"
          python -m pip check

      - name: Run tests with full-source coverage gate
        run: >-
          python -m pytest
          --cov=adaf_attack
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=84

      - name: CLI smoke tests
        shell: bash
        run: |
          adaf-attack --version
          adaf-attack doctor
          adaf-attack list-capabilities
          adaf-attack paths

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  security:
    name: Dependency and SAST audit
    needs: [lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade "backports.tarfile==1.2.0"
          python -m pip install --upgrade "importlib_metadata==9.0.0"
          python -m pip install --upgrade "colorama==0.4.6"
          python -m pip install --requirement requirements-ci.txt
          python -m pip install --no-deps --no-build-isolation -e ".[ci]"
          python -m pip check

      - name: Audit dependencies
        run: python -m pip_audit --strict --requirement requirements-ci.txt

      - name: Run Bandit SAST
        run: >-
          python -m bandit
          --recursive src
          --severity-level medium
          --confidence-level medium

  scripts:
    name: Validate installer scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Check Bash scripts
        run: shellcheck scripts/*.sh

      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem scripts/*.ps1, scripts/*.psm1 | ForEach-Object {
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$null,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors -and $parseErrors.Count -gt 0) {
              $errors += $_.FullName
            }
          }
          if ($errors.Count -gt 0) {
            Write-Error "PowerShell syntax errors found in: $($errors -join ', ')"
            exit 1
          }

      - name: Exercise Kali installer guard and help
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/install-kali.sh --help
          if bash scripts/install-kali.sh --skip-system-deps; then
            echo "Kali installer unexpectedly succeeded on a non-Kali runner" >&2
            exit 1
          fi

  workflow-contract:
    name: Validate CI and operator contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install contract checker
        run: python -m pip install --requirement requirements-ci.txt

      - name: Validate workflow YAML and referenced operator assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          workflow_path = Path(".github/workflows/ci.yml")
          workflow = yaml.safe_load(workflow_path.read_text(encoding="utf-8"))
          assert isinstance(workflow, dict)
          jobs = workflow["jobs"]
          required_jobs = {
              "lint", "typecheck", "tests", "security", "scripts",
              "workflow-contract", "package", "operator-workflow", "windows-installer",
              "ci-gate",
          }
          assert required_jobs <= jobs.keys()
          assert jobs["ci-gate"]["if"] == "always()"
          gate_needs = set(jobs["ci-gate"]["needs"])
          assert gate_needs == required_jobs - {"ci-gate"}
          assert set(jobs["tests"]["strategy"]["matrix"]["os"]) == {
              "ubuntu-24.04", "windows-2022"
          }
          assert set(jobs["tests"]["strategy"]["matrix"]["python-version"]) == {
              "3.11", "3.12", "3.13"
          }
          for path in (
              "README.md",
              "RELEASE.md",
              "docs/KALI.md",
              "docs/WINDOWS.md",
              "docs/LINUX_NOVICE_USABILITY_GUIDE.md",
              "scripts/install-kali.sh",
              "scripts/Install-AdafAttack.ps1",
              "scripts/AdafAttack.psm1",
          ):
              assert Path(path).is_file(), path
          PY

  package:
    name: Build and install package
    needs: [tests, security, scripts]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade "backports.tarfile==1.2.0"
          python -m pip install --upgrade "importlib_metadata==9.0.0"
          python -m pip install --upgrade "colorama==0.4.6"
          python -m pip install --requirement requirements-ci.txt
          python -m pip install --no-deps --no-build-isolation -e ".[ci]"

      - name: Build source distribution and wheel
        run: python -m build --no-isolation

      - name: Validate package metadata
        run: python -m twine check dist/*

      - name: Install wheel in clean environment
        run: |
          python -m venv .smoke-venv
          .smoke-venv/bin/python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade "backports.tarfile==1.2.0"
          python -m pip install --upgrade "importlib_metadata==9.0.0"
          python -m pip install --upgrade "colorama==0.4.6"
          .smoke-venv/bin/python -m pip install dist/*.whl
          .smoke-venv/bin/python -m pip check
          .smoke-venv/bin/adaf-attack --version
          .smoke-venv/bin/adaf-attack list-capabilities

      - name: Install source distribution in a separate clean environment
        run: |
          python -m venv .sdist-smoke-venv
          .sdist-smoke-venv/bin/python -m pip install --upgrade pip setuptools wheel
          .sdist-smoke-venv/bin/python -m pip install --requirement requirements-ci.txt
          .sdist-smoke-venv/bin/python -m pip install --no-index --no-deps --no-build-isolation dist/*.tar.gz
          .sdist-smoke-venv/bin/python -m pip check
          .sdist-smoke-venv/bin/adaf-attack --version
          .sdist-smoke-venv/bin/adaf-attack doctor

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/
          retention-days: 14

  operator-workflow:
    name: Offline operator workflow
    needs: [tests, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Download built distribution
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-distributions
          path: dist

      - name: Install full operator runtime
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --requirement requirements-ci.txt
          wheel=(dist/*.whl)
          python -m pip install "${wheel[0]}[full]"
          python -m pip check

      - name: Validate operator-facing CLI contract
        shell: bash
        run: |
          set -euo pipefail
          adaf-attack --format json doctor --explain > "$RUNNER_TEMP/doctor.json"
          adaf-attack --format json list-capabilities > "$RUNNER_TEMP/capabilities.json"
          adaf-attack --format json capability-help > "$RUNNER_TEMP/capability-help.json"
          adaf-attack --format json workflow-profiles > "$RUNNER_TEMP/workflow-profiles.json"
          adaf-attack --format json paths > "$RUNNER_TEMP/paths.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          for name in ("doctor", "capabilities", "capability-help", "workflow-profiles", "paths"):
              payload = json.loads((temp / f"{name}.json").read_text(encoding="utf-8"))
              assert isinstance(payload, dict) and payload.get("ok") is True, name
          assert json.loads((temp / "capabilities.json").read_text())["count"] > 0
          assert json.loads((temp / "workflow-profiles.json").read_text())["profiles"]
          PY

      - name: Validate scoped engagement lifecycle
        shell: bash
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/engagement.yaml"
          adaf-attack engagement init --output "$plan"
          adaf-attack --format json engagement validate "$plan" > "$RUNNER_TEMP/engagement.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads((Path(os.environ["RUNNER_TEMP"]) / "engagement.json").read_text())
          assert payload["ok"] is True
          assert payload["phase_count"] >= 1
          assert "report" in payload["allowed_capabilities"]
          PY

          run_plan="$RUNNER_TEMP/report-only-engagement.yaml"
          cat > "$run_plan" <<'YAML'
          engagement_id: CI-ENGAGEMENT-001
          target:
            domain: corp.example
            dc_ip: 10.0.0.10
          allowed_targets: [10.0.0.10]
          allowed_capabilities: [report]
          phases:
            - name: reporting
              capabilities: [report]
          YAML
          adaf-attack --format json engagement run "$run_plan" \
            --workspace "$RUNNER_TEMP/engagement-workspace" > "$RUNNER_TEMP/engagement-run.log"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          text = (temp / "engagement-run.log").read_text(encoding="utf-8")
          start = text.find("{")
          assert start >= 0
          payload, _ = json.JSONDecoder().raw_decode(text[start:])
          assert payload["ok"] is True
          assert payload["capabilities"] == ["report"]
          session = Path(payload["session_path"])
          assert (session / "session.json").is_file()
          assert (session / "events.jsonl").is_file()
          assert (session / "findings.json").is_file()
          assert (session / "reports" / "report-manifest.json").is_file()
          PY

      - name: Exercise offline evidence, reporting, and packaging workflow
        shell: bash
        run: |
          set -euo pipefail
          python scripts/render_demo_engagement.py
          session="output/demo-engagement"
          adaf-attack --format json engagement report --session "$session" --engagement-id DEMO-2026-001 > "$RUNNER_TEMP/report.json"
          adaf-attack --format json engagement package --session "$session" --output "$RUNNER_TEMP/demo-engagement.zip" --profile client > "$RUNNER_TEMP/package.json"
          adaf-attack --format json coercion-fixtures --fixtures tests/fixtures/demo-session --authorized-fixtures > "$RUNNER_TEMP/fixtures.json"
          python - <<'PY'
          import json
          import os
          import zipfile
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          report = json.loads((temp / "report.json").read_text())
          package = json.loads((temp / "package.json").read_text())
          fixtures = json.loads((temp / "fixtures.json").read_text())
          assert report["ok"] is True and report["finding_count"] >= 1
          assert package["ok"] is True and package["profile"] == "client"
          assert fixtures["ok"] is True
          with zipfile.ZipFile(temp / "demo-engagement.zip") as archive:
              names = archive.namelist()
          assert names and all("vault" not in name.lower() for name in names)
          manifest = json.loads(
              (Path("output/demo-engagement/reports") / "report-manifest.json").read_text()
          )
          assert manifest["finding_count"] == report["finding_count"]
          for report_name in ("executive", "technical", "remediation"):
              assert (Path("output/demo-engagement/reports") / f"{report_name}-report.html").is_file()
              assert (Path("output/demo-engagement/reports") / f"{report_name}-report.pdf").is_file()
          PY

      - name: Sweep offline operator review workflow
        shell: bash
        run: |
          set -euo pipefail
          session="output/demo-engagement"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          session = Path("output/demo-engagement")
          (session / "graph.json").write_text(
              json.dumps(
                  {
                      "nodes": [{"id": "USER@alice@CORP.LOCAL"}],
                      "edges": [],
                  }
              )
              + "\n",
              encoding="utf-8",
          )
          Path(os.environ["RUNNER_TEMP"]).joinpath("bloodhound.json").write_text(
              json.dumps({"nodes": [], "edges": []}) + "\n", encoding="utf-8"
          )
          Path(os.environ["RUNNER_TEMP"]).joinpath("report-plan.yaml").write_text(
              "engagement_id: CI-REPORT-001\n"
              "target:\n"
              "  domain: corp.example\n"
              "  dc_ip: 10.0.0.10\n"
              "allowed_targets: [10.0.0.10]\n"
              "allowed_capabilities: [report]\n"
              "phases:\n"
              "  - name: reporting\n"
              "    capabilities: [report]\n",
              encoding="utf-8",
          )
          Path(os.environ["RUNNER_TEMP"]).joinpath("campaign.yaml").write_text(
              "campaign_id: CI-CAMPAIGN-001\n"
              "engagements:\n"
              "  - plan: report-plan.yaml\n",
              encoding="utf-8",
          )
          PY
          campaign_output="$RUNNER_TEMP/campaign-workspace"
          adaf-attack --format json campaign-run \
            --campaign "$RUNNER_TEMP/campaign.yaml" \
            --workspace "$campaign_output" > "$RUNNER_TEMP/campaign-run.log"
          if adaf-attack --format json cleanup --session "$session" \
            --domain corp.example --dc-ip 10.0.0.10 > "$RUNNER_TEMP/cleanup-blocked.log" 2>&1; then
            echo "cleanup unexpectedly ran without --force" >&2
            exit 1
          fi
          declare -A commands=(
            [sessions]="adaf-attack --format json sessions --workspace output"
            [rank-paths]="adaf-attack --format json rank-paths --graph $session/graph.json"
            [credential-exposure]="adaf-attack --format json credential-exposure --session $session"
            [bloodhound-reconcile]="adaf-attack --format json bloodhound-reconcile --session $session --bloodhound $RUNNER_TEMP/bloodhound.json"
            [trust-correlation]="adaf-attack --format json trust-correlation --session $session"
            [delegation-validation]="adaf-attack --format json delegation-validation --session $session"
            [adcs-validation]="adaf-attack --format json adcs-validation --session $session"
            [campaign-compose]="adaf-attack --format json campaign-compose --session $session"
            [forest-campaign]="adaf-attack --format json forest-campaign --session $session"
            [purple-handoff]="adaf-attack --format json purple-handoff --session $session"
            [gpo-impact-plan]="adaf-attack --format json gpo-impact-plan --session $session"
            [coercion-fixtures]="adaf-attack --format json coercion-fixtures --fixtures tests/fixtures/demo-session --authorized-fixtures"
            [workflow-profiles]="adaf-attack --format json workflow-profiles purple-team"
          )
          for name in "${!commands[@]}"; do
            eval "${commands[$name]}" > "$RUNNER_TEMP/$name.json"
          done
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          temp = Path(os.environ["RUNNER_TEMP"])
          names = (
              "sessions", "rank-paths", "credential-exposure", "bloodhound-reconcile",
              "trust-correlation", "delegation-validation", "adcs-validation",
              "campaign-compose", "forest-campaign", "purple-handoff", "gpo-impact-plan",
              "coercion-fixtures", "workflow-profiles",
          )
          for name in names:
              payload = json.loads((temp / f"{name}.json").read_text(encoding="utf-8"))
              assert isinstance(payload, dict) and payload.get("ok") is True, name
          campaign_text = (temp / "campaign-run.log").read_text(encoding="utf-8")
          campaign_start = campaign_text.find("{")
          assert campaign_start >= 0
          campaign, _ = json.JSONDecoder().raw_decode(campaign_text[campaign_start:])
          assert campaign["ok"] is True and campaign["stopped"] is False
          assert len(campaign["completed"]) == 1
          assert (temp / "campaign-workspace" / "CI-CAMPAIGN-001" / "campaign.json").is_file()
          exposure = json.loads((temp / "credential-exposure.json").read_text())
          assert all(item["secret_value"] == "redacted" for item in exposure["exposures"])
          assert json.loads((temp / "rank-paths.json").read_text())["count"] >= 0
          PY

      - name: Upload operator evidence artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: operator-workflow-evidence
          path: |
            output/demo-engagement/reports/
            ${{ runner.temp }}/demo-engagement.zip
          if-no-files-found: error
          retention-days: 14

  windows-installer:
    name: Windows installer smoke test
    needs: [package, scripts]
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Run Windows installer and verify operator entry points
        shell: pwsh
        run: |
          & .\scripts\Install-AdafAttack.ps1 -RepoRoot $PWD -Extras full -Python python
          $venvPython = Join-Path $PWD ".venv\Scripts\python.exe"
          $venvCli = Join-Path $PWD ".venv\Scripts\adaf-attack.exe"
          if (-not (Test-Path $venvCli)) { throw "Installed console script missing: $venvCli" }
          & $venvPython -m pip check
          & $venvCli --version
          & $venvCli --format json doctor --explain | ConvertFrom-Json | ForEach-Object {
            if (-not $_.ok) { throw "doctor reported failure" }
          }
          & $venvCli list-capabilities
          Import-Module .\scripts\AdafAttack.psm1 -Force

          & $venvPython scripts\render_demo_engagement.py
          $session = Join-Path $PWD "output\demo-engagement"
          & $venvCli engagement report --session $session --engagement-id WIN-2026-001
          $package = Join-Path $env:RUNNER_TEMP "windows-demo-engagement.zip"
          & $venvCli --format json engagement package --session $session --output $package --profile client | ConvertFrom-Json | ForEach-Object {
            if (-not $_.ok) { throw "engagement package reported failure" }
          }
          if (-not (Test-Path (Join-Path $session "reports\report-manifest.json"))) {
            throw "report manifest missing"
          }
          if (-not (Test-Path $package)) { throw "engagement package missing" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($package)
          try {
            if ($archive.Entries.Count -eq 0) { throw "engagement package is empty" }
            if ($archive.Entries.FullName -match "vault") { throw "engagement package contains vault material" }
          } finally {
            $archive.Dispose()
          }

  ci-gate:
    name: Production readiness gate
    if: always()
    needs: [lint, typecheck, tests, security, scripts, workflow-contract, package, operator-workflow, windows-installer]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every CI lane to pass
        run: |
          test "${{ needs.lint.result }}" = success
          test "${{ needs.typecheck.result }}" = success
          test "${{ needs.tests.result }}" = success
          test "${{ needs.security.result }}" = success
          test "${{ needs.scripts.result }}" = success
          test "${{ needs.workflow-contract.result }}" = success
          test "${{ needs.package.result }}" = success
          test "${{ needs.operator-workflow.result }}" = success
          test "${{ needs.windows-installer.result }}" = success
