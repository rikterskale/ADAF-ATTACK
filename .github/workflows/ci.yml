name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs; keep main runs so green results stick
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"
  PIP_DEFAULT_TIMEOUT: "60"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install lint tools (retry)
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            python -m pip install --upgrade pip && \
            python -m pip install "ruff>=0.6.0" "mypy>=1.11.0" types-requests && \
            python -m pip install -e ".[dev]" && break
            echo "Install attempt $i failed; retrying..."
            sleep $((i * 5))
          done

      - name: Ruff check
        run: ruff check src tests

      - name: Ruff format check
        continue-on-error: true
        run: ruff format --check src tests

      - name: Mypy (advisory)
        continue-on-error: true
        run: mypy src/adaf_attack || true

  test:
    name: Test (${{ matrix.os }} / py${{ matrix.python-version }})
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Pin images — -latest drifts and is a common source of "Set up job" flakes
        os: [ubuntu-24.04, windows-2022]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package (dev + kerberos, retry)
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            python -m pip install --upgrade pip setuptools wheel && \
            python -m pip install -e ".[dev,kerberos]" && break
            echo "Install attempt $i failed; retrying..."
            sleep $((i * 8))
          done

      - name: Pytest
        run: python -m pytest -q --tb=short

      - name: CLI smoke — version / doctor / list / paths
        shell: bash
        run: |
          adaf-attack --version
          adaf-attack doctor
          adaf-attack list-capabilities
          adaf-attack paths

  package:
    name: Package build
    # Soft dependency: build even if a single matrix cell flaked on infra
    needs: [lint, test]
    if: ${{ always() && needs.lint.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build sdist + wheel
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            python -m pip install --upgrade pip build && \
            python -m build && break
            echo "Build attempt $i failed; retrying..."
            sleep $((i * 5))
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 14
