name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"
  PIP_DEFAULT_TIMEOUT: "60"

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade "backports.tarfile==1.2.0"
          python -m pip install --upgrade "importlib_metadata==9.0.0"
          python -m pip install --upgrade "colorama==0.4.6"
          python -m pip install --requirement requirements-ci.txt
          python -m pip install --no-deps --no-build-isolation -e ".[dev,ci]"
          python -m pip check

      - name: Ruff lint
        run: python -m ruff check src tests

      - name: Ruff format
        run: python -m ruff format --check src tests

  typecheck:
    name: Strict type checking
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade "backports.tarfile==1.2.0"
          python -m pip install --upgrade "importlib_metadata==9.0.0"
          python -m pip install --upgrade "colorama==0.4.6"
          python -m pip install --requirement requirements-ci.txt
          python -m pip install --no-deps --no-build-isolation -e ".[dev]"
          python -m pip check

      - name: Mypy
        run: python -m mypy src/adaf_attack

      - name: Compile Python sources
        run: python -m compileall -q src tests

  tests:
    name: Tests (${{ matrix.os }} / Python ${{ matrix.python-version }})
    needs: [lint, typecheck]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade "backports.tarfile==1.2.0"
          python -m pip install --upgrade "importlib_metadata==9.0.0"
          python -m pip install --upgrade "colorama==0.4.6"
          python -m pip install --requirement requirements-ci.txt
          python -m pip install --no-build-isolation -e ".[dev,kerberos,tui,reports]"
          python -m pip check

      - name: Run tests with full-source coverage gate
        run: >-
          python -m pytest
          --cov=adaf_attack
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=95

      - name: CLI smoke tests
        shell: bash
        run: |
          adaf-attack --version
          adaf-attack doctor
          adaf-attack list-capabilities
          adaf-attack paths

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  security:
    name: Dependency and SAST audit
    needs: [lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade "backports.tarfile==1.2.0"
          python -m pip install --upgrade "importlib_metadata==9.0.0"
          python -m pip install --upgrade "colorama==0.4.6"
          python -m pip install --requirement requirements-ci.txt
          python -m pip install --no-deps --no-build-isolation -e ".[ci]"
          python -m pip check

      - name: Audit dependencies
        run: python -m pip_audit --strict --requirement requirements-ci.txt

      - name: Run Bandit SAST
        run: >-
          python -m bandit
          --recursive src
          --severity-level medium
          --confidence-level medium

      - name: Scan tracked files for high-confidence secrets
        shell: bash
        run: |
          set -euo pipefail
          # Scan the entire tree. Explicit allowlist paths (below) may contain
          # deliberately-shaped test material; anything else with a real key or
          # cloud/VCS token fails the build.
          allowlist='^(tests/fixtures/allowlisted/|docs/security-examples/)'
          if git grep --cached --full-name -nI -E -e \
            '-----BEGIN (RSA|OPENSSH|EC|DSA|PGP|PRIVATE) KEY-----|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9_]{20,}|xox[baprs]-[A-Za-z0-9-]{20,}' \
            -- . \
            | grep -Ev "$allowlist"; then
            echo "High-confidence secret material detected in tracked files." >&2
            echo "If this is intentional test material, place it under tests/fixtures/allowlisted/ or docs/security-examples/." >&2
            exit 1
          fi

      - name: Generate dependency SBOM
        run: >-
          python -m pip_audit
          --requirement requirements-ci.txt
          --format cyclonedx-json
          --output sbom.json

      - name: Validate dependency SBOM
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          sbom = json.loads(Path("sbom.json").read_text(encoding="utf-8"))
          assert sbom.get("bomFormat") == "CycloneDX"
          assert sbom.get("components"), "SBOM has no dependency components"
          PY

      - name: Upload dependency SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-sbom
          path: sbom.json
          if-no-files-found: error
          retention-days: 14

  codeql:
    name: CodeQL local SAST
    needs: [lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: python
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6

      - name: Analyze and export SARIF
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: /language:python
          # Code Security is disabled for this private repository; the SARIF is
          # still written to disk (see output) and uploaded as a job artifact so
          # findings can be reviewed and trended without GitHub Code Security.
          upload: false
          output: codeql-results

      - name: Upload CodeQL SARIF artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-results
          path: codeql-results/
          if-no-files-found: warn
          retention-days: 30

  scripts:
    name: Validate installer scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-runtime.txt

      - name: Install runtime dependencies
        run: python -m pip install --requirement requirements-runtime.txt

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Check Bash scripts
        run: shellcheck scripts/*.sh

      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem scripts/*.ps1, scripts/*.psm1 | ForEach-Object {
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$null,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors -and $parseErrors.Count -gt 0) {
              $errors += $_.FullName
            }
          }
          if ($errors.Count -gt 0) {
            Write-Error "PowerShell syntax errors found in: $($errors -join ', ')"
            exit 1
          }

      - name: Exercise Kali installer guard and help
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/install-kali.sh --help
          if bash scripts/install-kali.sh --skip-system-deps; then
            echo "Kali installer unexpectedly succeeded on a non-Kali runner" >&2
            exit 1
          fi

  workflow-contract:
    name: Validate CI and operator contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install contract checker
        run: python -m pip install --requirement requirements-ci.txt

      - name: Validate workflow YAML and referenced operator assets
        run: python scripts/check_install_contracts.py

      - name: Verify capability catalog is regenerated
        run: python scripts/generate_capability_catalog.py --check

  package:
    name: Build and install package
    needs: [tests, security, scripts]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade "backports.tarfile==1.2.0"
          python -m pip install --upgrade "importlib_metadata==9.0.0"
          python -m pip install --upgrade "colorama==0.4.6"
          python -m pip install --requirement requirements-ci.txt
          python -m pip install --no-deps --no-build-isolation -e ".[ci]"

      - name: Build source distribution and wheel
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export PYTHONHASHSEED=0
          export TZ=UTC
          export LC_ALL=C
          python -m build --no-isolation

      - name: Verify reproducible distributions and checksums
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export PYTHONHASHSEED=0
          export TZ=UTC
          export LC_ALL=C
          python -m build --no-isolation --outdir dist
          rm -rf dist-repro-a dist-repro-b
          python -m build --no-isolation --outdir dist-repro-a
          python -m build --no-isolation --outdir dist-repro-b
          python - <<'PY'
          import gzip
          import hashlib
          import tarfile
          from pathlib import Path

          def digest(path: Path) -> str:
              hasher = hashlib.sha256()
              if path.name.endswith(".tar.gz"):
                  with tarfile.open(fileobj=gzip.open(path, "rb"), mode="r:") as archive:
                      for member in sorted(archive.getmembers(), key=lambda item: item.name):
                          if not member.isfile():
                              continue
                          hasher.update(member.name.encode("utf-8"))
                          hasher.update(b"\0")
                          hasher.update(archive.extractfile(member).read())
                          hasher.update(b"\0")
                  return hasher.hexdigest()
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def digests(root: str) -> dict[str, str]:
              return {
                  path.name: digest(path)
                  for path in sorted(Path(root).iterdir())
                  if path.is_file()
              }

          first = digests("dist-repro-a")
          second = digests("dist-repro-b")
          assert first and first == second, (first, second)
          PY
          (
            cd dist
            sha256sum * > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Generate and validate release manifest
        run: |
          python scripts/generate_release_manifest.py \
            --repo-root . \
            --dist dist \
            --output dist/release-manifest.json
          python scripts/generate_release_manifest.py \
            --repo-root . \
            --dist dist \
            --output dist/release-manifest.json \
            --validate

      - name: Validate package metadata
        run: python -m twine check dist/*.whl dist/*.tar.gz

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/
          retention-days: 14

  artifact-smoke:
    needs: [package]
    uses: ./.github/workflows/_artifact-smoke.yml

  kali-installer:
    needs: [package, scripts]
    uses: ./.github/workflows/_kali-installer.yml

  operator-workflow:
    name: Offline operator workflow
    needs: [tests, package]
    uses: ./.github/workflows/_operator-workflow.yml

  release-readiness:
    name: New-user release-readiness standard
    needs: [artifact-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Download built distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist

      - name: Validate release manifest
        run: >-
          python scripts/generate_release_manifest.py
          --repo-root . --dist dist
          --output dist/release-manifest.json --validate

      - name: Verify downloaded distribution checksums
        shell: bash
        run: |
          set -euo pipefail
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum -c SHA256SUMS)
          else
            (cd dist && shasum -a 256 -c SHA256SUMS)
          fi

      # Install ONLY the base wheel in a clean venv - the exact artifact a new
      # user gets, with optional tooling (impacket/certipy/tui/reports) absent.
      # This is what makes the "degraded optional tooling warns, it does not
      # fail" pillar a real test rather than a tautology. PyYAML is added solely
      # for the verifier's CI-binding layer, which parses ci.yml.
      - name: Install base artifact in a clean environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/newuser"
          # shellcheck disable=SC1091
          source "$RUNNER_TEMP/newuser/bin/activate"
          python -m pip install --upgrade pip
          wheel=(dist/*.whl)
          python -m pip install "${wheel[0]}"
          python -m pip install "pyyaml>=6.0"
          python -m pip check
          command -v adaf-attack

      - name: Enforce the five-pillar release-readiness standard
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source "$RUNNER_TEMP/newuser/bin/activate"
          # Drive the installed console script, exactly as a new user would.
          PYTHONUNBUFFERED=1 ADAF_CLI="$(command -v adaf-attack)" \
            python scripts/check_release_readiness.py --repo-root "$PWD"

      - name: Publish readiness summary
        if: always()
        shell: bash
        run: |
          {
            echo "## ADAF-ATTACK user readiness"
            echo "- Readiness verifier: ${{ needs.release-readiness.result }}"
            echo "- Clean artifact smoke: ${{ needs.artifact-smoke.result }}"
            echo "- Packaged offline demo: ${{ needs.operator-workflow.result }}"
            echo "- Reports and evidence package: ${{ needs.operator-workflow.result }}"
            echo "- Windows installer: ${{ needs.windows-installer.result }}"
            echo "- Kali installer: ${{ needs.kali-installer.result }}"
            echo "- Published artifact smoke: separate release-channel workflow"
          } >> "$GITHUB_STEP_SUMMARY"

  windows-installer:
    needs: [package, scripts]
    uses: ./.github/workflows/_windows-installer.yml

  private-index-smoke:
    name: Private index smoke (devpi)
    needs: [package]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install devpi-server and client
        run: |
          python -m pip install --upgrade pip
          python -m pip install "devpi-server==6.14.0" "devpi-client==7.2.0" "devpi-web==4.2.3"

      - name: Download built distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist

      - name: Start devpi-server, upload wheel, install from private index
        run: |
          set -euo pipefail
          export DEVPI_SERVERDIR="$RUNNER_TEMP/devpi"
          devpi-init --serverdir "$DEVPI_SERVERDIR"
          devpi-server --serverdir "$DEVPI_SERVERDIR" --host 127.0.0.1 --port 3141 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT

          # Wait for readiness.
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3141/+api > /dev/null; then break; fi
            sleep 1
          done

          devpi use http://127.0.0.1:3141
          devpi login root --password=''
          devpi user -c ciuser password=ci
          devpi login ciuser --password=ci
          devpi index -c dev bases=root/pypi volatile=True
          devpi use ciuser/dev

          # Upload only the wheel; sdist would require build isolation.
          shopt -s nullglob
          wheels=(dist/*.whl)
          [[ "${#wheels[@]}" -eq 1 ]]
          devpi upload --from-dir --formats=whl "$(dirname "${wheels[0]}")"

          python -m venv "$RUNNER_TEMP/private-venv"
          # shellcheck disable=SC1091
          source "$RUNNER_TEMP/private-venv/bin/activate"
          python -m pip install --upgrade pip
          python -m pip install \
            --index-url http://127.0.0.1:3141/ciuser/dev/+simple/ \
            --extra-index-url https://pypi.org/simple/ \
            adaf-attack
          python -m pip check
          adaf-attack --version
          adaf-attack --format json doctor --profile user-readiness --explain > "$RUNNER_TEMP/private-doctor.json"

  ci-gate:
    name: Production readiness gate
    if: always()
    needs: [lint, typecheck, tests, security, codeql, scripts, workflow-contract, package, artifact-smoke, kali-installer, operator-workflow, release-readiness, windows-installer, private-index-smoke]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every CI lane to pass
        run: |
          test "${{ needs.lint.result }}" = success
          test "${{ needs.typecheck.result }}" = success
          test "${{ needs.tests.result }}" = success
          test "${{ needs.security.result }}" = success
          test "${{ needs.codeql.result }}" = success
          test "${{ needs.scripts.result }}" = success
          test "${{ needs.workflow-contract.result }}" = success
          test "${{ needs.package.result }}" = success
          test "${{ needs.artifact-smoke.result }}" = success
          test "${{ needs.kali-installer.result }}" = success
          test "${{ needs.operator-workflow.result }}" = success
          test "${{ needs.release-readiness.result }}" = success
          test "${{ needs.windows-installer.result }}" = success
          test "${{ needs.private-index-smoke.result }}" = success
