[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adaf-attack"
version = "0.10.1"
description = "Aggressive Active Directory offensive toolkit for senior internal red teamers"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "LicenseRef-Proprietary"
authors = [{ name = "Rikter Skale" }]
keywords = [
    "active-directory",
    "red-team",
    "offensive-security",
    "kerberoasting",
    "adcs",
    "dcsync",
    "attack-paths",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]
dependencies = [
    "typer==0.27.1",
    "rich==15.0.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "httpx==0.28.1",
    "ldap3==2.9.1",
    "PyYAML==6.0.3",
    "cryptography==50.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "types-requests",
]
ci = [
    "bandit==1.9.4",
    "build==1.5.0",
    "pip-audit==2.10.1",
    "twine==7.0.0",
]
tui = [
    "textual==8.2.8",
]
certipy = ["certipy-ad==4.8.0"]
kerberos = [
    "impacket==0.13.1",
]
operator = [
    "adaf-attack[tui,kerberos,reports]",
]
full = [
    "adaf-attack[operator]",
]
reports = ["reportlab==5.0.0", "pypdf==6.16.1"]

[tool.setuptools.package-data]
adaf_attack = ["mappings/*.yaml", "demo_data/*.json"]

[project.scripts]
adaf-attack = "adaf_attack.cli:app"

[project.entry-points."adaf_attack.capabilities"]
# Third-party capabilities can register here without modifying the core package.

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    # Expanded quality families: aliases, comprehensions, timezone-aware
    # datetimes, naming, return flow, and Ruff-specific correctness checks.
    "A",
    "C4",
    "DTZ",
    "N",
    "PIE",
    "RET",
    "RUF",
]
ignore = [
    "B008",    # typer.Option in defaults is the normal pattern
    "E501",    # line length handled by formatter preference
    "SIM102",  # nested if readability OK in bind paths
    "SIM108",  # ternary not always clearer
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "A",       # test doubles intentionally mirror external API names
    "N",       # test doubles intentionally mirror external API names
    "RUF012",  # mutable test fixture state is local and isolated
    "RUF043",  # regex snippets in test assertions are intentional
    "RUF100",  # compatibility no-quas document mocked integration points
]
"src/adaf_attack/capabilities/__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true

[tool.coverage.run]
source = ["adaf_attack"]
