# Ruff hooks use an isolated environment pinned to the CI version below.
# The mypy hook uses the active project environment; install its CI pin using
# the setup instructions in CONTRIBUTING.md before running hooks.
# Install once with:  pre-commit install
# Run on demand with: pre-commit run --all-files
minimum_pre_commit_version: "3.5.0"

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep this rev == the `ruff==` pin in requirements-ci.txt. Different ruff
    # versions sort imports and format differently, which is what breaks CI.
    rev: v0.16.3
    hooks:
      - id: ruff
        name: ruff lint (src, tests)
        args: [--fix]
      - id: ruff-format
        name: ruff format (src, tests)

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict

  - repo: local
    hooks:
      # Runs in your active project environment with the mypy version installed
      # by the pinned setup command in CONTRIBUTING.md; language: system does
      # not install or pin mypy. Mirrors `python -m mypy src/adaf_attack` in CI.
      - id: mypy
        name: mypy (strict, src/adaf_attack)
        entry: python -m mypy src/adaf_attack
        language: system
        pass_filenames: false
        types: [python]
